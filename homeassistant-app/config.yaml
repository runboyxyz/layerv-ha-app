name: LayerV Home Assistant Gateway
version: "0.1.23"
slug: layerv_ha_gateway
description: Share selected Home Assistant controls through revocable, expiring LayerV qURLs
url: https://layerv.ai
image: ghcr.io/runboyxyz/layerv-ha-app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
apparmor: true
ingress: true
ingress_port: 8099
panel_icon: mdi:layers-triple
panel_title: LayerV Gateway
homeassistant_api: true
hassio_role: default
options:
  connector_id: ""
  include_domains: ""
  include_areas: ""
  exclude_domains: "camera,alarm_control_panel"
  exclude_entities: ""
schema:
  connector_id: "str?"
  include_domains: "str?"
  include_areas: "str?"
  exclude_domains: "str?"
  exclude_entities: "str?"
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Public gateway (leave disabled; LayerV Connector uses it internally)

name: LayerV Home Assistant Gateway
version: "0.1.11"
slug: layerv_ha_gateway
description: Create revocable LayerV qURLs for selected Home Assistant entities
url: https://github.com/runboyxyz/layerv-ha-app
image: ghcr.io/runboyxyz/layerv-ha-app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-link-variant
homeassistant_api: true
hassio_role: default
options:
  layerv_api_token: ""
  connector_id: ""
  include_domains: ""
  include_areas: ""
  exclude_domains: "camera,alarm_control_panel"
  exclude_entities: ""
schema:
  layerv_api_token: password
  connector_id: "str?"
  include_domains: "str?"
  include_areas: "str?"
  exclude_domains: "str?"
  exclude_entities: "str?"
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Public gateway (leave disabled; LayerV Connector uses it internally)


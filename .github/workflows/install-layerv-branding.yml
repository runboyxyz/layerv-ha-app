name: Install LayerV App branding

on:
  push:
    paths:
      - .github/workflows/install-layerv-branding.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write Home Assistant branding assets
        shell: bash
        run: |
          echo '' | base64 -d > homeassistant-app/logo.png
          echo '' | base64 -d > homeassistant-app/icon.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add homeassistant-app/logo.png homeassistant-app/icon.png
          git commit -m "Add LayerV App Store branding"
          git push
